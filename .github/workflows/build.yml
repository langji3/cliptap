name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package lightweight build
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ClipTap-win-x64
          path: artifacts/ClipTap-win-x64-framework-dependent.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-previews
          path: artifacts/test-results/*.png
